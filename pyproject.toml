[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "agent-iceman"
version = "0.12.0"
description = "Agent Iceman — a safety-first Cloud and DevOps CLI agent with pluggable AI reasoning."
readme = "README.md"
authors = [{ name = "Semicrypt" }]
maintainers = [
    { name = "Semicrypt", email = "nifeanyidivine@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
  "typer>=0.27.2,<1.0",
  "rich>=14.1,<15.0",
  "openai>=3.13.0,<4.0",
  "pydantic>=2.12,<3.0",
]

[project.urls]
Repository = "https://github.com/Semicrypt/iceman-agent"
Issues = "https://github.com/Semicrypt/iceman-agent/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
]

[project.scripts]
iceman = "iceman.cli:app"
ice = "iceman.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/iceman"]
