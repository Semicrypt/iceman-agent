[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iceman-agent"
version = "0.9.8"
description = "A safety-first Cloud and DevOps CLI agent with pluggable AI reasoning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.27.2,<1.0",
  "rich>=14.1,<15.0",
  "openai>=3.13.0,<4.0",
  "pydantic>=2.12,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
]

[project.scripts]
iceman = "iceman.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/iceman"]
