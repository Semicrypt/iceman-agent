name: Agent Iceman CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest -q

  package:
    name: Build and verify wheel
    needs: tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Verify clean installation
        run: |
          python -m venv /tmp/agent-iceman-test
          /tmp/agent-iceman-test/bin/python -m pip install \
            dist/agent_iceman-*.whl

          cd /tmp

          /tmp/agent-iceman-test/bin/ice --version

          ICEMAN_KNOWLEDGE_MODE=offline \
            /tmp/agent-iceman-test/bin/ice ask \
            "What is Kubernetes?"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: agent-iceman-wheel
          path: dist/*.whl
